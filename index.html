<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayu Naufal - Information Systems Student</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --biru: #1C4D8D;
      --biru-gelap: #103261;
      --biru-muda: #e6f0fa;
      --hitam: #000000;
      --putih: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Chakra Petch", sans-serif;
      background: var(--putih);
      color: var(--hitam);
      border: 12px solid var(--biru);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero-page {
      position: relative;
      min-height: calc(100vh - 24px); /* Memperbaiki typo perhitungan minus */
      overflow: hidden;
      padding: 0 90px;
    }

    header {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 50px;
    }

    .logo {
      position: relative;
      font-size: 2.4rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--hitam);
      z-index: 1;
    }
    .logo::before {
      content: "";
      position: absolute;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: var(--biru-gelap);
      top: -28px; left: -8px;
      z-index: -1;
    }
    .logo::after {
      content: "";
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--biru);
      opacity: .85;
      top: -22px; left: -6px;
      z-index: -1;
    }

    nav { display: flex; align-items: center; gap: 36px; }
    nav a {
      color: var(--hitam);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
    }
    nav a:hover { color: var(--biru); }

    .btn {
      display: inline-block;
      background: var(--biru);
      color: var(--putih);
      font-family: inherit;
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }
    .btn:hover { transform: translateY(-3px); background: #153c70; }

    .btn-contact { padding: 10px 40px; font-size: 1.05rem; }

    .hero {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 640px;
    }

    .hero-text { max-width: 580px; padding-top: 40px; }

    .hero-text h2 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--hitam);
    }
    .hero-text h2 .nama {
      font-family: "Kaushan Script", cursive;
      font-weight: 400;
      font-size: 3.6rem;
      margin-left: 6px;
      color: var(--biru);
    }

    .hero-text h1 {
      color: var(--hitam);
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .hero-text p {
      font-size: 1.08rem;
      line-height: 1.6;
      max-width: 520px;
      margin-bottom: 30px;
      color: var(--hitam);
    }

    .find-me { 
      font-size: 1.2rem; 
      margin-bottom: 14px; 
      color: var(--hitam); 
    }

    .sosmed { display: flex; gap: 22px; margin-bottom: 36px; font-size: 1.4rem; }
    .sosmed a { 
      color: var(--hitam); 
    }
    .sosmed a:hover { color: var(--biru); }

    .hero-btn { display: flex; gap: 48px; }
    .hero-btn .btn {
      width: 220px;
      padding: 12px 0;
      box-shadow: 0 6px 12px rgba(28, 77, 141, .2);
    }

    .hero-img {
      position: relative;
      width: 560px;
      height: 600px;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .hero-img .lingkaran-besar {
      position: absolute;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: var(--biru);
      bottom: 0; left: 0;
    }
    .hero-img img {
      position: absolute;
      bottom: -10px;
      left: 60px;
      width: 480px;
      height: auto;
      z-index: 2;
      object-fit: cover;
      object-position: top;
    }

    .dot { position: absolute; border-radius: 50%; z-index: 1; }
    .dot-1 { width: 55px;  height: 55px;  background: var(--biru-muda);  top: 90px;  right: 420px; z-index: 6; }
    .dot-2 { width: 100px; height: 100px; background: var(--biru-muda);  top: 170px; right: 270px; }
    .dot-3 { width: 200px; height: 200px; background: #d0e1f9;  top: 250px; right: 40px;  }
    .dot-4 { width: 140px; height: 140px; background: #d0e1f9;  bottom: -20px; left: -20px; }

    /* ========================================= */
    /* RESPONSIVE CSS (DIPERBAIKI UNTUK HP & PC) */
    /* ========================================= */

    @media (max-width: 1024px) {
      .hero-page { padding: 0 40px; }
      .hero { flex-direction: column-reverse; text-align: center; padding-top: 20px; min-height: auto; }
      .hero-text { max-width: 100%; padding-top: 20px; display: flex; flex-direction: column; align-items: center; }
      .hero-text p { margin-inline: auto; }
      .sosmed, .hero-btn { justify-content: center; }
      
      .hero-img { 
        width: 100%; 
        max-width: 400px; 
        height: 400px; 
        margin: 0 auto; 
        align-self: center;
      }
      .hero-img .lingkaran-besar { width: 320px; height: 320px; left: 50%; transform: translateX(-50%); bottom: 0; }
      .hero-img img { width: 300px; left: 50%; transform: translateX(-50%); }
    }

    @media (max-width: 768px) {
      body { border-width: 6px; } /* Border sedikit lebih tipis di HP agar tidak memakan layar */
      .hero-page { padding: 0 20px; }
      
      header { padding-top: 25px; flex-direction: column; gap: 15px; }
      nav { display: flex; gap: 20px; font-size: 0.9rem; } /* Menu tetap tampil rapi di HP */
      
      .hero-text h2 { font-size: 2.2rem; }
      .hero-text h2 .nama { font-size: 2.6rem; display: inline-block; }
      .hero-text h1 { font-size: 2.2rem; }
      .hero-text p { font-size: 0.95rem; }
      
      .dot-1, .dot-2, .dot-3, .dot-4 { display: none; } /* Menyembunyikan dekorasi titik agar bersih di layar kecil */
    }

    @media (max-width: 480px) {
      .hero-text h2 { font-size: 1.8rem; }
      .hero-text h2 .nama { font-size: 2.2rem; }
      .hero-text h1 { font-size: 1.8rem; }
      nav { gap: 15px; font-size: 0.85rem; }
      .hero-img { width: 100%; height: 320px; max-width: 300px; }
      .hero-img .lingkaran-besar { width: 260px; height: 260px; }
      .hero-img img { width: 240px; }
    }
  </style>
</head>

<body>
  <div class="hero-page">

    <span class="dot dot-1"></span>
    <span class="dot dot-2"></span>
    <span class="dot dot-3"></span>
    <span class="dot dot-4"></span>

    <header>
      <a href="#" class="logo">Bayu Naufal</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="experience.html">Experience</a>
      </nav>
      <a href="https://wa.me/6285710158868" class="btn btn-contact">Contact</a>
    </header>

    <main class="hero">
      <section class="hero-text">
        <h2>Hi, I'm <span class="nama">Bayu Naufal</span></h2>
        <h1>Information Systems Student</h1>
        <p>
          Deeply enthusiastic about technology, network engineering, and web development. 
          Building secure infrastructure and modern digital experiences from the ground up.
        </p>

        <p class="find-me">Find Me on</p>
        <div class="sosmed">
          <a href="https://www.instagram.com/bayuunaufal27?mdxt=MWkzaWV2ajUwNWt5aw==" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://www.linkedin.com/in/bayu-naufal-9ba82a391?utm_source=share_via&utm_content=profile&utm_medium=member_android" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>

      </section>

      <section class="hero-img">
        <div class="lingkaran-besar"></div>
        <img src="src\foto1.png" alt="Bayu's Photo">
      </section>
    </main>

  </div>
</body>
</html>
